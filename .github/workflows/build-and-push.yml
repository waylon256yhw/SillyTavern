name: Build and Push Docker Image to ACR

on:
  push:
    branches:
      - 'release' # 当 'release' 分支有更新时触发
  workflow_dispatch: # 允许手动触发

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Aliyun Container Registry (ACR)
        uses: docker/login-action@v2
        with:
          registry: crpi-3a1po2uu5pumq1lq.ap-southeast-1.personal.cr.aliyuncs.com
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: crpi-3a1po2uu5pumq1lq.ap-southeast-1.personal.cr.aliyuncs.com/waylon256/waylon:latest
